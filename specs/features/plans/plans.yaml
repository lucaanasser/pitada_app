# specs/features/plans/plans.yaml -> lib/features/plans/
feature: Planos
prototype: "TAB-PLANOS + SHEET-MEAL + SHEET-ADDMEAL em pitada.html"
purpose: >
  Planejar o dia por refeições. Cada refeição tem uma meta de kcal e opções de
  cardápio; escolher uma opção soma para o total do dia contra a meta diária.
  Grama é a base; kcal e macros vêm das receitas.

data:
  models:
    - Plan:            # o plano ativo (um por vez)
        campos:
          - id: String
          - name: String            # rótulo interno ("Meu plano"); NÃO exibido na tela
          - dailyGoalKcal: int      # 1900
          - proteinGoal: int        # meta diária de proteína em gramas (150)
          - carbGoal: int           # meta diária de carboidrato em gramas (200)
          - fatGoal: int            # meta diária de gordura em gramas (90)
          - meals: List<Meal>
    - Meal:            # uma refeição do dia (Café, Almoço, Jantar, Lanche)
        campos:
          - id: String
          - name: String            # "Almoço"
          - goalKcal: int           # meta da refeição (650)
          - chosenIndex: int        # opção escolhida; -1 = nenhuma
          - options: List<MealOption>
    - MealOption:      # uma alternativa de cardápio p/ a refeição
        campos:
          - id: String
          - name: String            # rótulo livre da aba; vazio => cai em "Opção N" na UI
          - chosen: bool            # a opção do dia (leva o selo "Hoje")
          - items: List<MealOptionItem>
        derivado: "totalKcal = soma dos items.kcal"
    - MealOptionItem:  # um prato dentro da opção
        campos:
          - name: String
          - kcal: int
          - recipeId: String?       # preenchido => prato linkado (abrível)
          - portion: String?        # referência humana exibida ("1 porção", "1 xícara")
  repository: PlansRepository        # em memória (seed) hoje; Supabase depois
  seed: plan_seed.dart               # "Meu plano" 1900; Café da manhã/Almoço/Jantar/Lanche (opções sem nome => 'Opção N', como na foto de referência)
  regras:
    - "Modelos: classes puras imutáveis, const constructor (como Recipe). Sem freezed/json."
    - "MealOptionItem.recipeId != null => item linkado (OptionDish.linked = true)."

application:
  providers:
    - plansRepositoryProvider (Provider<PlansRepository>)
    - planProvider (FutureProvider<Plan>)            # o plano ativo do usuário
    - dayTotalKcalProvider (Provider<int>)            # soma das opções escolhidas do dia
    - dayMacrosProvider (Provider<DayMacros>)         # Prot/Carb/Gord agregados (record simples)
  acoes:
    - "PlanController.chooseOption(mealId, optionIndex): marca a opção escolhida (a
       aba ativa = a opção escolhida; tocar numa aba escolhe aquela opção)."
    - "PlanController.renameOption(mealId, optionIndex, name): renomeia a opção
       (rótulo livre da aba). name vazio => a UI cai em 'Opção N'."
    - "PlanController.reorderMeals(oldIndex, newIndex): move a refeição para a
       posição final newIndex na lista do dia (arrastar-para-reordenar). Índices
       fora do intervalo são ignorados (aviso no log). Ligado ao
       ReorderableListView.onReorderItem (já entrega o índice final ajustado)."
    - "PlanController.updateGoals(kcal, protein, carb, fat): troca as metas diárias
       do plano (usado pelo sheet 'Editar metas'). Valores <= 0 são ignorados."
  notas:
    - "Sem dias/log: a aba é só a lista do plano (o que se pretende comer), não um diário."
    - "dayTotalKcal soma optionTotal(chosenIndex) de cada Meal com chosenIndex >= 0."
    - "status do plano: 'Dentro da meta · sobram N kcal' se total<=meta; senão 'Acima da meta · N kcal a mais'."
    - "Números formatados via core/utils/format (formatKcal) e locale pt-BR: formatKcal
       aplica separador de milhar com ponto (1718 -> '1.718')."

screens:
  - PlansScreen:
      file: lib/features/plans/presentation/plans_screen.dart
      tipo: ConsumerWidget
      prototype: ".tab#tab-planos (.today/.days/.meal/.addmeal)"
      fundo: pit.tabBg(2)   # pastel da aba — casa com a faixa do shell atrás do dock
      layout:   # de cima pra baixo — CABEÇALHO COMPARTILHADO + sub-abas (ver plans_progress.yaml)
        - Masthead
        - "título 'Plano' (AppType.screenTitle) + subtítulo 'Hoje, D mmm'
           (formatTodayLabel, pit.muted) embaixo + PitadaIconButton calendário
           (AppIcons.calendarPattern, filled, iconButtonSm) à direita -> showPlanAddSheet.
           Recolhe JUNTO com o anel ao rolar (ver COLAPSA)."
        - "DaySummaryView (SEM caixa/borda): anel de macros COMPACTO à ESQUERDA
           (lado máx ~170 — destaque moderado, sem roubar espaço das refeições) +
           legenda DISCRETA à direita. 4 anéis concêntricos (de fora p/ dentro:
           Calorias/accent, Proteína/sage, Carboidratos/macroCarb, Gorduras/macroFat),
           arco SEMPRE em cor cheia sobre trilho NEUTRO (pit.line2 no selecionado,
           pit.line nos demais — nunca a cor esmaecida). O selecionado engrossa o
           traço; o centro mostra SÓ o número grande + unidade dele, limitado ao
           miolo (NUNCA vaza sobre os anéis). Legenda quase invisível: bolinha
           pequena + rótulo (caption text2) + 'valor / meta' (captionSm muted);
           toque seleciona (no item ou no próprio anel). Começa em Calorias."
        - "linha abaixo do anel (mesmo gutter): 'Restam N kcal' (pit.muted) à esquerda
           e 'Editar metas' (pit.text2) à direita -> showGoalSheet"
        - "COLAPSA NO SCROLL (um snap só, ~220ms, AnimatedCrossFade): ao rolar o
           corpo além de ~28px, título 'Plano' + anel + legenda + linha de metas
           recolhem JUNTOS e viram MacroLinesView — 4 barras horizontais finas (uma
           por macro, mesma ordem/cor do anel). Recolhido, o topo fixo é só marca +
           barras + abas, liberando altura das refeições. De volta ao topo reaparece
           tudo; trocar de sub-aba reseta. Título e anel somem na MESMA animação —
           dois estágios em sequência ficam estranhos."
        - "PitadaTabs ['Cardápio', 'Progresso'] abaixo dos macros, alinhadas à
           ESQUERDA (como nas demais telas) e com respiro xl após os macros"
        - "sub-aba 0 = MenuView; sub-aba 1 = ProgressView (peso + aderência, ver plans_progress.yaml)"
      menu_view:   # presentation/widgets/menu_view.dart — corpo da sub-aba 0
        - "lista REORDENÁVEL de refeições (ReorderableListView shrinkWrap dentro do ListView
           da tela; buildDefaultDragHandles=false, proxyDecorator flat/sem sombra), cada uma
           como SEÇÃO direto no fundo da aba — NADA de card sobre card. Cabeçalho: nome
           (AppType.title; toque -> showMealSheet; SEGURAR o nome arrasta p/ reordenar via
           ReorderableDelayedDragStartListener, sem pega visível) + 'Meta N kcal' + lápis
           à direita (toque -> showMealSheet)."
        - "MealOptionTabs (option_tabs.dart): fita de abas de pasta como as abas
           Ingredientes/Preparo/Histórico do detalhe da receita na referência:
           abas de LARGURA IGUAL preenchendo toda a fita (Expanded), retângulo de
           topo arredondado (radiusMd), SEM borda e SEM curva S. Ativa: cor do
           corpo (pit.surf2), texto pit.text — funde com o corpo sem emenda;
           inativas: pit.surf, texto muted. SEM selo 'Hoje' na aba (a ativa JÁ é a
           escolhida). Tocar numa aba => chooseOption; segurar/duplo-clique na
           ativa => showOptionNameSheet. Aba '+' estreita fixa => showAddOptionSheet.
           Rótulo = option.name ou 'Opção N' se vazio."
        - "MealOptionPanel (option_panel.dart): corpo da pasta (pit.surf2, raio
           radiusCard SÓ nos cantos de baixo — as abas cobrem todo o topo; SEM
           borda): um HairlineRow por prato —
           leading = RecipeMark (o MESMO marca-página da lista de Receitas) quando linkado,
           bolinha pit.muted quando avulso; título + porção (portion) embaixo; kcal +
           chevron à direita (toque só nos linkados -> /recipe/:id). Depois: linha
           '+ Receita ou alimento' (accent) -> showAddOptionSheet; filete; rodapé
           (totalKcal grande + 'Dentro da meta' sage ou '+N kcal' accent2 + linha P/C/G
           com valores pit.text e letras pit.muted). SEM botão de registrar consumo.
           Refeição sem opções => só a ação 'Adicionar opção'."
        - "abaixo da pasta: 'Comparar opções ->' (accent2) -> showCompareOptionsSheet
           (aparece só com 2+ opções)"
        - "PitadaButton(outline) 'Adicionar refeição' -> showMealSheet(novo)"
      widgets_da_feature:   # em presentation/widgets/meal/ (tela > 200 linhas => quebrar)
        - DaySummaryView      # anel de macros interativo (anel à esquerda + legenda com valores à direita), sem caixa
        - MacroLinesView      # forma COLAPSADA do resumo: 4 barras horizontais (FuelBar) — uma por macro — pro cabeçalho durante o scroll
        - MacroRingPainter    # CustomPainter dos anéis concêntricos + dayMacroRings (fonte única da ordem/cor/rótulo dos 4 macros, usada pelo anel e pelas linhas)
        - MealCard            # seção da refeição (cabeçalho + pasta de opções + comparar), sem caixa
        - MealOptionTabs      # fita de abas (pasta) das opções + aba '+'
        - MealOptionPanel     # corpo da pasta (pratos + adicionar + rodapé)
        - MealHeaderRow       # nome (toca -> showMealSheet; segurar arrasta) + 'Meta N kcal' + lápis
      navega: RecipeDetailScreen (/recipe/:id)  # ao tocar prato linkado no painel da opção

sheets:
  - showPlanAddSheet:
      file: lib/features/plans/presentation/sheets/plan/plan_add_sheet.dart
      assinatura: "void showPlanAddSheet(BuildContext context)"
      proposito: >
        Atalho do '+' do cabeçalho. NÃO substitui os botões existentes — só
        reúne os mesmos fluxos num lugar. Usa o AddOptionsSheet compartilhado.
      conteudo:
        - "título 'Adicionar ao Plano'"
        - "Nova refeição (clay, AppIcons.dish) -> showMealSheet (mesmo do botão do Cardápio)"
        - "Registrar refeição (ochre, AppIcons.logDay) -> showLogDaySheet (mesmo da TodaySection)"
        - "Registrar peso (teal, AppIcons.weight) -> showLogWeightSheet (mesmo do Progresso)"
  - showMealSheet:
      file: lib/features/plans/presentation/sheets/plan/meal_sheet.dart
      assinatura: "void showMealSheet(BuildContext context, {Meal? meal})"
      prototype: ".sheet#sheet-meal"
      proposito: "Nova refeição ou editar existente."
      conteudo:
        - grip
        - "título: 'Nova refeição' (meal==null) ou 'Editar refeição'"
        - "campo nome (hint 'Ex.: Pré-treino')"
        - "campo meta kcal (numérico, hint 'kcal')"
        - "PitadaButton(primary) 'Salvar'"
        - "se editando: ação 'Remover refeição' (texto, cor accent2) -> exclui"
  - showAddOptionSheet:
      file: lib/features/plans/presentation/sheets/plan/add_option_sheet.dart
      assinatura: "void showAddOptionSheet(BuildContext context, {required Meal meal})"
      prototype: ".sheet#sheet-addmeal (openAddOption/pickOption)"
      proposito: "Escolher uma receita salva como nova opção da refeição."
      conteudo:
        - grip
        - "título 'Nova opção · <nome da refeição>' + subtítulo 'Escolha uma receita salva para a opção'"
        - "lista de receitas salvas (recipesProvider): RecipeThumb (pastel pit.card(hero),
           outlined) /HairlineRow com nome, kcal e
           selo de encaixe: 'cabe' (sage) se recipe.kcal<=meta.goalKcal, senão '+N' (accent2)"
        - "tocar => adiciona MealOption com o item da receita e fecha"
  - showOptionNameSheet:
      file: lib/features/plans/presentation/sheets/plan/option_name_sheet.dart
      assinatura: "void showOptionNameSheet(BuildContext context, {required String mealId, required int optionIndex, required String currentName})"
      proposito: "Renomear a aba de uma opção (rótulo livre)."
      conteudo:
        - grip
        - "título 'Nome da opção' + campo de texto (hint 'Ex.: Clássico')"
        - "PitadaButton(primary) 'Salvar' -> PlanController.renameOption; vazio volta a 'Opção N'"
  - showGoalSheet:
      file: lib/features/plans/presentation/sheets/plan/goal_sheet.dart
      assinatura: "void showGoalSheet(BuildContext context, {required Plan plan})"
      proposito: "Editar as metas diárias do plano (link 'Editar metas' sob o anel)."
      conteudo:
        - grip
        - "título 'Editar metas'"
        - "4 EditTextField numéricos: Calorias (kcal), Proteína (g), Carboidratos (g), Gorduras (g)"
        - "PitadaButton(primary) 'Salvar' -> PlanController.updateGoals"
  - showCompareOptionsSheet:
      file: lib/features/plans/presentation/sheets/plan/compare_options_sheet.dart
      assinatura: "void showCompareOptionsSheet(BuildContext context, {required Meal meal})"
      proposito: "Comparar as opções da refeição lado a lado e escolher uma."
      conteudo:
        - grip
        - "título 'Comparar opções · <refeição>'"
        - "um HairlineRow por opção: nome (ou 'Opção N') + macros P/C/G embaixo;
           kcal + selo 'Hoje' (PitadaTag sage) se escolhida à direita"
        - "tocar => PlanController.chooseOption + fecha"

components_reutilizados: [Masthead, SectionHeader, HairlineRow, PitadaTag, FuelBar,
  RecipeThumb, PitadaSearchField, PitadaButton, PitadaIconButton, Editable, EmptyState]

usa_de_outras_features:
  - recipes/application/recipe_providers.dart (recipesProvider)  # lista p/ showAddOptionSheet
  - recipes/presentation/widgets/list/recipe_row.dart (RecipeMark)  # marca-página nos pratos linkados
  - recipes/application/recipe_filters.dart (Mastery)  # estado do RecipeMark
  - navegação a /recipe/:id (RecipeDetailScreen) em pratos linkados
